[General]
# Image behind the login screen (absolute path, readable by the sddm user),
# for example /usr/share/backgrounds/<name>.jpg; empty for backgroundColor.
# Set it in theme.conf.user or with SDDM Settings (Login Window).
background=
backgroundColor=#000000
# One image across all monitors instead of one per monitor
stretchBackgroundAcrossMonitors=true
# zoom (fill, cropped), scaled (whole picture), stretched or centered
backgroundFill=zoom
# The monitor the login box is on: auto (SDDM's primary) or a connector
# name, as DP-1 or HDMI-A-1
monitor=auto
# left, center or right
contentAlign=left
font=Ubuntu
# strftime-like Qt format of the top bar clock
clockFormat=HH:mm
showHostname=true
showClock=true
showPower=true
# An entry for typing a user name, like LightDM's manual login
showManualLogin=true
# List the users (off: only the entry for typing a user name)
showUserList=true
# Comma separated user names not to list
hiddenUsers=
# auto (2 on screens 1800 px or more high), or a number
scale=auto
